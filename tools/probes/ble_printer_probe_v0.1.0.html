<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLE Printer Probe</title>
<style>
:root{
  --bg:#f5f5f2;--fg:#1c1c1a;--muted:#6d6d67;--card:#ffffff;--line:#dcdcd5;
  --accent:#2f6fde;--ok:#1f9d55;--warn:#b7791f;--err:#c0392b;--rx:#7c3aed;--tx:#0e7490;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--fg:#ecece8;--muted:#9a9a93;--card:#1e1e1c;--line:#33332e;
  --accent:#6c9cff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--rx:#c4b5fd;--tx:#67e8f9}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0}
.badge{font:12px var(--mono);padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.env{font-size:13px;color:var(--muted);margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label{font-size:13px;color:var(--muted)}
input[type=text],select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:13px var(--mono)}
textarea{width:100%;min-height:44px;resize:vertical}
input[type=number]{width:70px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:600 13px system-ui;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.presets button{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.presets button:hover:not(:disabled){border-color:var(--accent)}
#hexIn{flex:1;min-width:220px}
#target{min-width:280px;max-width:100%}
#log{background:var(--bg);border:1px solid var(--line);border-radius:6px;height:420px;overflow:auto;padding:8px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
.l.ok{color:var(--ok)}.l.warn{color:var(--warn)}.l.err{color:var(--err)}.l.rx{color:var(--rx)}.l.tx{color:var(--tx)}.l.svc{font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<main>
<header>
  <h1>BLE Printer Probe</h1>
  <span class="badge" id="ver"></span>
  <span class="env" id="env"></span>
</header>

<section class="card">
  <h2>1. Connect</h2>
  <div class="row">
    <label for="namePrefix">Name prefix</label>
    <input type="text" id="namePrefix" value="eTP">
    <label><input type="checkbox" id="showAll"> Show all devices</label>
  </div>
  <label for="extra">Extra service UUIDs (optional, comma separated, short or full)</label>
  <textarea id="extra" placeholder="e.g. ff00, 0000abcd-0000-1000-8000-00805f9b34fb"></textarea>
  <div class="row" style="margin-top:10px;margin-bottom:0">
    <button id="btnConnect">Connect</button>
    <button id="btnDisconnect" class="ghost" disabled>Disconnect</button>
    <button id="btnRescan" class="ghost" disabled>Re-list services</button>
  </div>
  <p class="hint">Close the phone app first (or turn off phone Bluetooth). These printers accept only one connection at a time.</p>
</section>

<section class="card">
  <h2>2. Send</h2>
  <div class="row">
    <label for="target">Target</label>
    <select id="target" disabled><option>Connect first</option></select>
  </div>
  <div class="row">
    <label>Chunk size</label><input type="number" id="chunk" value="20" min="1" max="512">
    <label><input type="checkbox" id="noResp" checked> Prefer write without response</label>
  </div>
  <div class="row presets" id="presets"></div>
  <div class="row" style="margin-bottom:0">
    <input type="text" id="hexIn" placeholder="Raw hex, e.g. 1b 40 0a 0a">
    <button id="btnSend" disabled>Send hex</button>
  </div>
</section>

<section class="card">
  <h2>3. Log</h2>
  <div class="row">
    <button id="btnCopy" class="ghost">Copy log</button>
    <button id="btnClear" class="ghost">Clear</button>
  </div>
  <div id="log"></div>
</section>
</main>

<script>
const VERSION = '0.1.0';

// Service UUIDs commonly used by cheap BLE thermal printers.
// Web Bluetooth only exposes services that are declared up front, so the list matters.
const KNOWN = [
  ['ae30', 'Cat printer family (GB/GT/MX)'],
  ['ae00', 'Cat printer variant'],
  ['af30', 'Cat printer variant'],
  ['ff00', 'Vendor FF00 (Phomemo and others)'],
  ['ff10', 'Vendor FF10'],
  ['ff80', 'Vendor FF80'],
  ['fff0', 'Vendor FFF0'],
  ['ffe0', 'HM-10 style UART'],
  ['ffb0', 'Vendor FFB0'],
  ['abf0', 'Vendor ABF0'],
  ['18f0', 'Generic BLE printer (often ESC/POS)'],
  ['fee7', 'Tencent vendor service'],
  ['e7810a71-73ae-499d-8c15-faa9aef0c3f2', 'ESC/POS over BLE (common)'],
  ['49535343-fe7d-4ae5-8fa9-9fafd205e455', 'Microchip ISSC transparent UART'],
  ['6e400001-b5a3-f393-e0a9-e50e24dcca9e', 'Nordic UART'],
  ['180a', 'Device Information'],
  ['180f', 'Battery'],
];

const $ = s => document.querySelector(s);
const logEl = $('#log');
let device = null, server = null;
const chars = [];

$('#ver').textContent = 'v' + VERSION;
document.title = 'BLE Printer Probe v' + VERSION;

function toUuid(s) {
  s = s.trim().toLowerCase().replace(/^0x/, '');
  if (/^[0-9a-f]{4}$/.test(s) || /^[0-9a-f]{8}$/.test(s)) return BluetoothUUID.canonicalUUID(parseInt(s, 16));
  return s;
}
function shortName(uuid) {
  const m = uuid.match(/^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/);
  return m ? '0x' + m[1].toUpperCase() : uuid;
}
function bytesOf(v) {
  if (v instanceof DataView) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  return new Uint8Array(v);
}
function hex(v) { return [...bytesOf(v)].map(b => b.toString(16).padStart(2, '0')).join(' '); }
function ascii(v) { return [...bytesOf(v)].map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join(''); }
function parseHex(str) {
  const clean = str.replace(/0x/gi, '').replace(/[^0-9a-f]/gi, '');
  if (clean.length % 2) throw new Error('Odd number of hex digits');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function ts() { const d = new Date(); return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
function log(msg, cls = '') {
  const el = document.createElement('div');
  el.className = 'l ' + cls;
  el.textContent = `[${ts()}] ${msg}`;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

// Cat printer protocol: 51 78 CMD 00 LEN_LO LEN_HI DATA... CRC8(DATA) FF
function crc8(data) {
  let c = 0;
  for (const b of data) {
    c ^= b;
    for (let i = 0; i < 8; i++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff;
  }
  return c;
}
function catPacket(cmd, data) {
  return Uint8Array.of(0x51, 0x78, cmd, 0x00, data.length & 0xff, (data.length >> 8) & 0xff, ...data, crc8(data), 0xff);
}
const enc = s => [...new TextEncoder().encode(s)];

const PRESETS = [
  ['Cat: feed paper', () => catPacket(0xA1, [0x30, 0x00])],
  ['Cat: get state', () => catPacket(0xA3, [0x00])],
  ['Cat: get info', () => catPacket(0xA8, [0x00])],
  ['ESC/POS: init + text', () => Uint8Array.from([0x1b, 0x40, ...enc('eTP6S probe test\n'), 0x1b, 0x64, 0x03])],
  ['ESC/POS: feed 3 lines', () => Uint8Array.of(0x1b, 0x64, 0x03)],
  ['Raw: 3 line feeds', () => Uint8Array.of(0x0a, 0x0a, 0x0a)],
];
const presetsEl = $('#presets');
for (const [name, fn] of PRESETS) {
  const b = document.createElement('button');
  b.textContent = name;
  b.disabled = true;
  b.onclick = () => send(fn(), name);
  presetsEl.appendChild(b);
}

function setConnected(on) {
  $('#btnConnect').disabled = on;
  $('#btnDisconnect').disabled = !on;
  $('#btnRescan').disabled = !on;
  $('#btnSend').disabled = !on;
  $('#target').disabled = !on;
  presetsEl.querySelectorAll('button').forEach(b => b.disabled = !on);
}

(function checkEnv() {
  const ok = !!navigator.bluetooth && window.isSecureContext;
  $('#env').textContent = ok ? 'Web Bluetooth available' : 'Web Bluetooth NOT available (use Chrome or Edge)';
  $('#env').style.color = ok ? 'var(--ok)' : 'var(--err)';
  log(`BLE Printer Probe v${VERSION}`);
  log(`UA: ${navigator.userAgent}`);
  if (!ok) log('Web Bluetooth not available. Open this file in Chrome or Edge on desktop.', 'err');
})();

async function connect() {
  try {
    const extra = $('#extra').value.split(/[\s,]+/).filter(Boolean).map(toUuid);
    const opts = { optionalServices: [...KNOWN.map(k => toUuid(k[0])), ...extra] };
    const prefix = $('#namePrefix').value.trim();
    if ($('#showAll').checked || !prefix) opts.acceptAllDevices = true;
    else opts.filters = [{ namePrefix: prefix }];

    log('Opening device chooser...');
    device = await navigator.bluetooth.requestDevice(opts);
    log(`Selected: "${device.name}" (id ${device.id})`, 'ok');
    device.addEventListener('gattserverdisconnected', () => { log('Device disconnected', 'warn'); setConnected(false); });

    log('Connecting GATT...');
    server = await device.gatt.connect();
    log('GATT connected', 'ok');
    setConnected(true);
    await enumerate();
  } catch (e) {
    log('Connect failed: ' + e.message, 'err');
  }
}

async function enumerate() {
  chars.length = 0;
  const labels = Object.fromEntries(KNOWN.map(k => [toUuid(k[0]), k[1]]));
  let services;
  try {
    services = await server.getPrimaryServices();
  } catch (e) {
    log('No accessible services: ' + e.message, 'err');
    log('The printer uses a service not in the known list. Need UUIDs from nRF Connect, then add them under "Extra service UUIDs".', 'warn');
    fillTargets();
    return;
  }
  log(`Found ${services.length} accessible service(s)`, 'ok');

  for (const s of services) {
    log(`SERVICE ${shortName(s.uuid)}  ${labels[s.uuid] || ''}`, 'svc');
    let cs = [];
    try { cs = await s.getCharacteristics(); }
    catch (e) { log('  could not list characteristics: ' + e.message, 'err'); continue; }

    for (const c of cs) {
      const p = c.properties;
      const props = ['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'].filter(k => p[k]);
      log(`  CHAR ${shortName(c.uuid)}  [${props.join(', ')}]`);
      chars.push({ svc: s.uuid, uuid: c.uuid, props, ch: c });

      if (p.read) {
        try { const v = await c.readValue(); log(`    value: ${hex(v)}  "${ascii(v)}"`); }
        catch (e) { log('    read failed: ' + e.message, 'warn'); }
      }
      if (p.notify || p.indicate) {
        try {
          await c.startNotifications();
          c.addEventListener('characteristicvaluechanged', ev =>
            log(`RX ${shortName(c.uuid)}: ${hex(ev.target.value)}  "${ascii(ev.target.value)}"`, 'rx'));
          log('    notifications on', 'ok');
        } catch (e) { log('    notify failed: ' + e.message, 'warn'); }
      }
    }
  }
  fillTargets();
}

function fillTargets() {
  const sel = $('#target');
  sel.innerHTML = '';
  const writable = chars.map((c, i) => ({ c, i })).filter(({ c }) => c.ch.properties.write || c.ch.properties.writeWithoutResponse);
  if (!writable.length) { sel.innerHTML = '<option value="">No writable characteristic found</option>'; return; }
  const prefer = ['ae01', 'ff02', '2af1', 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f'].map(toUuid);
  let best = writable[0].i;
  for (const p of prefer) { const hit = writable.find(({ c }) => c.uuid === p); if (hit) { best = hit.i; break; } }
  for (const { c, i } of writable) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${shortName(c.uuid)}  (svc ${shortName(c.svc)})  [${c.props.join(', ')}]`;
    if (i === best) o.selected = true;
    sel.appendChild(o);
  }
  log(`Default target: ${shortName(chars[best].uuid)}`);
}

async function send(bytes, label = 'hex') {
  const entry = chars[$('#target').value];
  if (!entry) { log('No target characteristic selected', 'err'); return; }
  const p = entry.ch.properties;
  const noResp = p.writeWithoutResponse && ($('#noResp').checked || !p.write);
  const chunk = Math.max(1, parseInt($('#chunk').value) || 20);
  try {
    for (let i = 0; i < bytes.length; i += chunk) {
      const part = bytes.slice(i, i + chunk);
      if (noResp) await entry.ch.writeValueWithoutResponse(part);
      else await entry.ch.writeValueWithResponse(part);
      await sleep(15);
    }
    const preview = hex(bytes.slice(0, 64)) + (bytes.length > 64 ? ' ...' : '');
    log(`TX [${label}] -> ${shortName(entry.uuid)} (${bytes.length} B, ${noResp ? 'no-resp' : 'with-resp'}): ${preview}`, 'tx');
  } catch (e) {
    log(`TX [${label}] failed: ${e.message}`, 'err');
  }
}

$('#btnConnect').onclick = connect;
$('#btnDisconnect').onclick = () => { if (device?.gatt.connected) device.gatt.disconnect(); };
$('#btnRescan').onclick = enumerate;
$('#btnSend').onclick = () => { try { send(parseHex($('#hexIn').value), 'raw'); } catch (e) { log('Bad hex: ' + e.message, 'err'); } };
$('#btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.innerText); log('Log copied to clipboard', 'ok'); }
  catch (e) { log('Copy failed, select the log text manually', 'warn'); }
};
$('#btnClear').onclick = () => { logEl.innerHTML = ''; };
</script>
</body>
</html>
